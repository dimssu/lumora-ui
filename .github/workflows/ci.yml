name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Registry is fresh
        run: |
          node scripts/build-registry.mjs
          git diff --exit-code registry/ || {
            echo "registry/registry.json is stale — run 'node scripts/build-registry.mjs' and commit."
            exit 1
          }

      - name: Build docs site
        run: pnpm --filter @lumora/web build
